# ============================================================================
# nginx-headscale-oidc.conf — B168 (v1.5.2) OIDC callback route
#
# Add this to the fronting nginx config (the one serving
# head.skynas.ru). The headscale container serves the
# OIDC callback at /oidc/callback on its gRPC-gateway
# port (50444). Without this route, the Tailscale
# client's OIDC login flow fails at the very last
# step: skygate 302s the browser to
# https://head.skynas.ru/oidc/callback?code=... but
# the fronting nginx returns 404.
#
# What this does
# --------------
# Adds a single `location = /oidc/callback { ... }` rule
# INSIDE the existing `server { listen 443 ... server_name
# head.skynas.ru; ... }` block on the fronting VM. The
# rule proxies the request to headscale:50444 (the
# gRPC-gateway port that serves the OIDC callback).
#
# Where to put this
# -----------------
# Open the nginx config that serves head.skynas.ru
# (usually /etc/nginx/nginx.conf or
# /etc/nginx/sites-enabled/skynas.ru.conf) and find the
# existing `server { listen 443 ... server_name
# head.skynas.ru; ... }` block. Inside that block,
# add the `location = /oidc/callback { ... }` rule
# alongside the other `location` rules (e.g. the
# existing /api/, /ts2021/, /machine/, /key rules).
#
# Pre-requisite
# -------------
# The upstream `headscale` must already resolve. If the
# fronting nginx uses an IP-based upstream (e.g.
# `server 192.168.13.69:50444`), the rule below uses
# that. If it uses a Docker-network name (e.g.
# `headscale:50444`), the fronting VM must be on the
# same docker network.
#
# Note: this snippet assumes the operator's existing
# nginx is the openresty on the fronting VM. The
# config pattern (location + proxy_pass + standard
# X-Forwarded-* headers) is identical for openresty
# and stock nginx.
# ============================================================================

# Paste this INSIDE the existing
#   server { listen 443 ... server_name head.skynas.ru; ... }
# block, alongside the other location rules.

    # OIDC callback (B168) — the browser is redirected
    # here by skygate.skynas.ru/oidc/authorize after a
    # successful OIDC login. headscale exchanges the
    # auth code for a token, then redirects the browser
    # to the user's Tailscale client (which completes
    # the device registration).
    #
    # The gRPC-gateway port 50444 serves BOTH the JSON
    # /api/v1/* AND the OIDC /oidc/callback. We use
    # `location =` (exact match) to avoid accidentally
    # matching /oidc/callback/anything-else that the
    # skygate side might want to handle.
    location = /oidc/callback {
        proxy_pass http://headscale_backend_50444;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        # The OIDC callback redirects the browser to a
        # tailscale:// or https:// URL; 30s is plenty
        # for the headscale server to process the auth
        # code + write the audit row.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

# --- upstream declaration (paste OUTSIDE the server block, alongside the
# other upstream declarations) ---

# If the existing config already declares a `headscale` or
# `headscale_50444` upstream for /api/v1/* traffic, REUSE that one
# instead of declaring a new one. The typical existing upstream
# (from the project's Caddyfile template + the operator's openresty
# config) looks like:
#
#   upstream headscale_backend_50444 {
#       server 192.168.13.69:50444;
#       keepalive 32;
#   }
#
# If the existing config uses a different upstream name, change the
# `proxy_pass http://headscale_backend_50444;` line above to match.
