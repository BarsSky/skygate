# ============================================================================
# skygate.skynas.ru — OIDC vhost for skygate OIDC provider
# B168 (v1.5.2) — full Option C (docker + systemd + k8s +
# manual + download + auto-init + API)
#
# IF YOU USE NGINX PROXY MANAGER (NPM), DO NOT PASTE THIS
# FILE. Instead, follow the NPM runbook in
# `docs/internal/https-setup.md` — "Alternative: Nginx Proxy
# Manager (NPM) on a separate VM". NPM is a web UI for
# nginx; you configure it there, not via file.
#
# Operator (raw nginx / openresty): paste this entire file
# as /etc/nginx/sites-enabled/skygate-oidc.conf (or
# wherever your nginx loads site configs from), then:
#   nginx -t
#   nginx -s reload
#
# Tested on openresty 1.x (the operator's existing server).
# Works on stock nginx 1.18+ too.
#
# What this does:
#   - Terminates TLS for skygate.skynas.ru (Let's Encrypt
#     cert via HTTP-01 challenge on port 80)
#   - HTTP → HTTPS redirect
#   - Proxies the 5 OIDC endpoints + the 2 admin/oidc
#     pages to the skygate container (192.168.13.69:8080)
#   - Sets X-Forwarded-Proto so skygate's OIDC code
#     renders https:// in the issuer claim
#
# Prerequisites:
#   1. DNS A-record skygate.skynas.ru → 95.165.170.190 (already done)
#   2. Ports 80 + 443 reachable from the public internet on
#      95.165.170.190 (firewall / security group)
#   3. skygate VM reachable on 192.168.13.69:8080 from this
#      nginx (network ACL — same VPC / direct route)
#   4. A TLS cert (certbot or existing pipeline) — see
#      "TLS cert options" below
#
# After nginx is reloaded, on the skygate VM run:
#   bash deploy/scripts/setup-skygate-public.sh --issuer https://skygate.skynas.ru
#
# See docs/internal/https-setup.md for the full NPM-aware
# runbook + the 5-step end-to-end verification commands.
# ============================================================================

# --- Upstream: where skygate actually runs ---
# 192.168.13.69 = skygate VM internal IP. If your nginx is
# on a different host and skygate is in a private VPC, use
# that private IP here (NOT the public IP — that would loop).
upstream skygate_backend {
    server 192.168.13.69:8080;
    keepalive 32;
}

# --- HTTP :80 server: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name skygate.skynas.ru;

    # Let's Encrypt HTTP-01 challenge. The certbot client
    # writes the challenge response to this directory.
    # If you use a different ACME client (e.g. acme.sh), point
    # it at the same path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else on port 80 → 443. This is a hard
    # redirect (301) so the browser immediately retries
    # over TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 server: the OIDC vhost ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skygate.skynas.ru;

    # ----- TLS cert -----
    # Pick ONE of the 3 options below. Delete the others.

    # Option A: certbot (recommended — auto-renewed via systemd timer)
    ssl_certificate     /etc/letsencrypt/live/skygate.skynas.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skygate.skynas.ru/privkey.pem;

    # Option B: pre-existing TLS pipeline (e.g. uploaded cert)
    # ssl_certificate     /etc/nginx/ssl/skygate.skynas.ru.crt;
    # ssl_certificate_key /etc/nginx/ssl/skygate.skynas.ru.key;

    # Option C: Tailscale cert (only for tailnet clients)
    # ssl_certificate     /var/lib/tailscale/certs/skygate.skynas.ru.crt;
    # ssl_certificate_key /var/lib/tailscale/certs/skygate.skynas.ru.key;

    # Modern TLS — same defaults as head.skynas.ru
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — uncomment after the cert is verified working.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ----- Logging -----
    access_log /var/log/nginx/skygate-oidc-access.log;
    error_log  /var/log/nginx/skygate-oidc-error.log warn;

    # ----- Common proxy settings -----
    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # The skygate OIDC code uses X-Forwarded-Proto to decide
    # between http:// and https:// in the issuer claim. If
    # this header is missing or wrong, the Tailscale login
    # fails with "issuer mismatch".

    # ----- Route: OIDC discovery (cached 1h) -----
    location = /.well-known/openid-configuration {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ----- Route: OIDC JWKS (cached 1h) -----
    location = /oidc/jwks.json {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ----- Route: OIDC authorize + token + userinfo -----
    # These are per-request (no cache). 60s timeout for the
    # authorize flow (browser is in the loop — user might
    # be typing creds).
    location /oidc/ {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ----- Route: /admin/oidc (the operator-facing page) -----
    location /admin/oidc {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----- Route: /admin/oidc/sync (B167 Apply button) -----
    # The Apply POST runs deploy/oidc-sync.sh synchronously
    # (up to 120s for the headscale health wait). 130s
    # proxy timeout to match.
    location /admin/oidc/sync {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    # ----- Default: anything else goes to skygate -----
    # (covers /login, /dashboard, /api/*, /static/*, etc.)
    location / {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================================
# After saving: how to enable the certbot cert (Option A)
# ============================================================================
#
# 1. nginx -t                    (syntax check)
# 2. systemctl reload nginx       (apply)
# 3. certbot certonly --nginx -d skygate.skynas.ru
#    (writes /etc/letsencrypt/live/skygate.skynas.ru/{fullchain.pem,privkey.pem}
#     and configures the auto-renewal timer)
# 4. systemctl reload nginx       (load the new cert)
# 5. Verify:
#      curl -sI https://skygate.skynas.ru/.well-known/openid-configuration
#        → HTTP/2 200, X-Forwarded-Proto: https
#      curl -sI https://skygate.skynas.ru/oidc/jwks.json
#        → HTTP/2 200
#      curl -sI https://skygate.skynas.ru/oidc/authorize
#        → HTTP/2 302, Location: /login?next=...
#
# If the certbot HTTP-01 challenge fails, common causes:
#   - Port 80 not reachable from Let's Encrypt (firewall)
#   - DNS A-record points to wrong IP
#   - Another nginx vhost on port 80 with a more specific
#     server_name is intercepting the challenge request
#
# ============================================================================
# Operator runbook
# ============================================================================
#
# After nginx is reloaded, on the skygate VM run:
#   bash deploy/scripts/setup-skygate-public.sh --issuer https://skygate.skynas.ru
#
# That script:
#   1. Validates https://skygate.skynas.ru/.well-known/openid-configuration returns 200
#   2. Updates SKYGATE_OIDC_ISSUER + SKYGATE_OIDC_REDIRECT_URIS in /home/skyadmin/skygate/.env
#   3. Restarts skygate container (so it picks up the new env)
#   4. Verifies the discovery doc now reports issuer=https://skygate.skynas.ru
#   5. Runs deploy/oidc-sync.sh in docker mode (pushes the new
#      headscale.conf + restarts headscale)
#   6. Writes an oidc_setup audit row
#
# Final verification:
#   curl -s https://skygate.skynas.ru/.well-known/openid-configuration | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuer"])'
#     → should print: https://skygate.skynas.ru
#
# Then on a Tailscale client:
#   tailscale up --login-server https://head.skynas.ru
#   (the OIDC dance: headscale → skygate.skynas.ru/oidc/authorize
#    → /login → /oidc/authorize → /oidc/callback on head.skynas.ru)
