# ============================================================================
# nginx-skygate-oidc.conf — B168 (v1.5.2) OIDC public endpoint
#
# Operator-facing runbook for the live OIDC e2e test. The
# operator pastes this server block into their existing
# nginx config (on the fronting VM) + adds the DNS
# A-record on reg.ru, then `nginx -t && nginx -s reload`.
#
# What this does
# --------------
# Fronts `skygate.skynas.ru` → skygate container (port
# 8080) on the skygate VM. The OIDC endpoints
# (`/.well-known/openid-configuration`, `/oidc/jwks.json`,
# `/oidc/authorize`, `/oidc/token`, `/oidc/userinfo`) are
# served by the skygate Go binary (B161.1-3). The Tailscale
# client (in the operator's browser) hits these endpoints
# during the OIDC login flow.
#
# Where to put this
# -----------------
# On the FRONTING VM (the one that has the public IP and
# the existing `head.skynas.ru` nginx config). Paste this
# block into the same `nginx.conf` (or a sites-enabled/
# include file referenced from nginx.conf) — anywhere
# OUTSIDE the existing `server { ... }` blocks.
#
# Pre-requisites (operator action before nginx reload)
# ---------------------------------------------------
# 1. DNS A-record on reg.ru:
#      skygate.skynas.ru → <skygate-vm-public-ip>
#    (the SAME public IP as head.skynas.ru — same VM)
#
# 2. TLS cert for skygate.skynas.ru:
#    - Option A (recommended, automated): certbot with
#      HTTP-01 challenge (port 80 must be reachable from
#      Let's Encrypt)
#    - Option B (existing TLS pipeline): reuse whatever
#      cert issuer the fronting VM already uses for
#      head.skynas.ru (e.g. reg.ru cert, uploaded to
#      /etc/nginx/ssl/skynas.ru.pem + .key)
#    - Option C: Tailscale cert via tailscale cert
#      skygate.skynas.ru (only works for tailnet clients,
#      not the public Tailscale login flow)
#
# 3. The skygate VM must be reachable on port 8080 from
#    the fronting VM. If the fronting VM is in a separate
#    VPC, the firewall needs a rule for `<fronting-VM>:443
#    → <skygate-VM>:8080`. The skygate VM's docker-compose
#    already binds 8080 to 0.0.0.0 (no firewall change on
#    the skygate side needed).
#
# What the operator does after pasting this
# -----------------------------------------
# 1. nginx -t  (syntax check)
# 2. nginx -s reload  (apply)
# 3. curl -s https://skygate.skynas.ru/.well-known/openid-configuration
#    → should return the OIDC discovery JSON (issuer=
#    https://skygate.skynas.ru, 4 endpoint URLs)
# 4. On the skygate VM, run:
#    bash deploy/scripts/setup-skygate-public.sh --issuer https://skygate.skynas.ru
#    → updates SKYGATE_OIDC_ISSUER + SKYGATE_OIDC_REDIRECT_URIS in .env,
#      restarts skygate, runs deploy/oidc-sync.sh in docker mode
#      to write the new headscale.conf + restart headscale.
# 5. On a Tailscale client:
#    tailscale up --login-server https://head.skynas.ru
#    → browser opens https://skygate.skynas.ru/oidc/authorize →
#      /login → /oidc/callback → device registered.
# ============================================================================

# --- HTTPS server block for skygate.skynas.ru ---
# Paste this inside the `http { }` block of nginx.conf,
# OUTSIDE the existing `server { ... }` blocks.

# Shared upstream + map directives (also OUTSIDE the server block):
upstream skygate_backend {
    # <skygate-vm-ip> is the IP of the skygate VM on the
    # internal network. Common values:
    #   - 192.168.13.69 (current skygate VM, also runs
    #     headscale + headplane)
    #   - 10.x.x.x (VPC-internal IP if skygate is in a
    #     cloud VPC)
    # Replace with the actual IP. Do NOT use a hostname
    # (DNS round-robin would break OIDC's session cookies).
    server 192.168.13.69:8080;
    keepalive 32;
}

# HTTP → HTTPS redirect for skygate.skynas.ru
server {
    listen 80;
    listen [::]:80;
    server_name skygate.skynas.ru;

    # ACME http-01 challenge (for certbot / Let's Encrypt).
    # If you use a different cert issuer, drop this block
    # and just `return 301 https://...` here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skygate.skynas.ru;

    # --- TLS cert ---
    # Option A: certbot (recommended, auto-renewed):
    #   ssl_certificate     /etc/letsencrypt/live/skygate.skynas.ru/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/skygate.skynas.ru/privkey.pem;
    # Option B: existing TLS pipeline (e.g. reg.ru cert):
    #   ssl_certificate     /etc/nginx/ssl/skynas.ru.crt;
    #   ssl_certificate_key /etc/nginx/ssl/skynas.ru.key;
    # Option C: Tailscale cert (only works for tailnet clients):
    #   ssl_certificate     /var/lib/tailscale/certs/skygate.skynas.ru.crt;
    #   ssl_certificate_key /var/lib/tailscale/certs/skygate.skynas.ru.key;

    # --- Modern TLS config (matches head.skynas.ru on the same VM) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year + subdomains + preload; uncomment after
    # the cert is verified working)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- Logging ---
    access_log /var/log/nginx/skygate-oidc-access.log;
    error_log  /var/log/nginx/skygate-oidc-error.log;

    # --- Common settings ---
    client_max_body_size 16m;  # /admin/oidc/sync form upload size
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # The skygate OIDC code uses X-Forwarded-Proto to decide
    # between http:// and https:// in the issuer claim. If the
    # header is missing, skygate falls back to http:// — which
    # would break the Tailscale login flow.

    # --- OIDC-specific route ---
    # The OIDC flow has 5 endpoints. They all proxy to the
    # same upstream (skygate:8080) — no path-based routing
    # needed (unlike the head.skynas.ru vhost, which splits
    # between skygate + headscale + headplane).

    # Discovery + JWKS (no auth, public)
    location = /.well-known/openid-configuration {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long cache (the discovery doc only changes on
        # config update; Caddy has the same 1h default)
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /oidc/jwks.json {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # /oidc/authorize (GET) + /oidc/token (POST) + /oidc/userinfo (GET)
    # These endpoints are authenticated. No cache (the token
    # exchange + userinfo response are per-request).
    location /oidc/ {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 60s proxy timeout — the /oidc/authorize handler
        # may wait for the skygate login redirect chain
        # (operator types creds in the browser)
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # /admin/oidc (the operator-facing page that shows the
    # current OIDC config + the snippet for headscale.conf).
    # This is authenticated; same proxy rules as /oidc/.
    location /admin/oidc {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /admin/oidc/sync (B167 — the "Apply" button for headscale.conf sync)
    location /admin/oidc/sync {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The Apply POST runs the bash script synchronously
        # (up to 120s for the health check); bump the proxy
        # timeout to match
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }

    # Default: proxy everything else to skygate (the rest
    # of the OIDC + admin surface).
    location / {
        proxy_pass http://skygate_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
