# HAProxy config for skygate PG HA.
#
# Used by BOTH skygate-host-1 (primary) AND skygate-host-2 (replica).
# Each HAProxy instance knows about BOTH nodes — Patroni updates
# the labels via the REST API as nodes change role.
#
# Routing:
#   :5000 = PRIMARY (read+write) — Patroni-elected primary
#   :5001 = REPLICA (read-only)  — Patroni-elected replicas (currently 1)
#   :5002 = STATS (admin UI)     — http://localhost:5002/stats
#
# The skygate Go app connects to :5000 (always the primary).
# For read-heavy workloads, future code can route SELECTs to
# :5001, but that's a future optimization.

global
    maxconn 100
    log stdout format raw daemon

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout check   5s

# Primary — Patroni API check returns 200 only on the primary.
frontend skygate-pg-primary
    bind *:5000
    default_backend skygate-pg-primary-backend

backend skygate-pg-primary-backend
    option httpchk GET /primary
    http-check expect status 200
    # Patroni updates the DNS or IP for these. Using IPs for clarity.
    # On skygate-host-1: PRIMARY is self (192.0.2.1:5432)
    # On skygate-host-2: PRIMARY is skygate-host-1 (192.0.2.1:5432)
    # HAProxy checks /primary on the local Patroni REST API (8008)
    # and forwards to the Patroni-reported primary on :5432.
    # We use a single backend `servers` entry that points to the
    # local Patroni's "primary" endpoint — but Patroni's REST
    # API doesn't proxy, it just reports. So we use `patroni`
    # callback: each HAProxy instance must dynamically update
    # its backend from the local Patroni REST API.
    #
    # The simpler way: use the Patroni `consul` service discovery
    # OR rely on the local `restapi` to confirm primary.
    #
    # For v0.32.21 we use a static config + a small wrapper
    # script (update-haproxy-from-patroni.sh, see init scripts)
    # that runs on every state change.

# Replica — read-only routing.
frontend skygate-pg-replica
    bind *:5001
    default_backend skygate-pg-replica-backend

backend skygate-pg-replica-backend
    option httpchk GET /replica
    http-check expect status 200

# Stats UI (optional, can be removed for production).
frontend skygate-pg-stats
    bind *:5002
    default_backend skygate-pg-stats-backend

backend skygate-pg-stats-backend
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-desc

# Patroni REST API check (used by the local HAProxy to confirm
# this node's role before forwarding).
frontend skygate-pg-patroni-check
    bind *:8009
    default_backend skygate-pg-patroni-check-backend

backend skygate-pg-patroni-check-backend
    server patroni 127.0.0.1:8008 check
