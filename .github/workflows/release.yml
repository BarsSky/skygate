name: release

# V8 (B237.15) — release workflow.
# Triggered ONLY by tag pushes matching v* (e.g. v1.5.0, v1.5.2-alpha1).
# Skips pre-releases for the `:latest` tag (alpha/beta/rc go only to
# the versioned tag, so production can pin to `:vX.Y.Z` without ever
# pulling a pre-release by accident).
#
# On each tag, publishes:
#   1. Docker image to ghcr.io/barssky/skygate
#      - ghcr.io/barssky/skygate:v1.5.0          (every tag, including pre-releases)
#      - ghcr.io/barssky/skygate:latest          (stable tags only — no -rc/-alpha/-beta)
#      - ghcr.io/barssky/skygate:v1.5            (major.minor, for "track latest patch")
#      - ghcr.io/barssky/skygate:v1              (major, for "track latest minor")
#      - linux/amd64 only — see Job 1 header for the
#        Issue #4 closure rationale (drop arm64)
#   2. Go binary tarballs to GitHub Releases (the artifact V3/V4 install
#      scripts pull):
#      - skygate-v1.5.0-linux-amd64.tar.gz       (binary + SHA256)
#      - skygate-v1.5.0-linux-arm64.tar.gz       (Go binary, NOT a Docker image — operators
#                                                 on ARM hosts can run it natively or
#                                                 buildx their own Docker image from source)
#      - skygate-v1.5.0-darwin-amd64.tar.gz
#      - skygate-v1.5.0-darwin-arm64.tar.gz
#      - skygate-v1.5.0-windows-amd64.zip        (skygate.exe + SHA256)
#   3. SHA256SUMS file alongside the release
#
# Why a SEPARATE workflow (not combined with ci.yml):
#   - ci.yml runs on every push to main + every PR. The release
#     workflow runs ONLY on tag pushes. A combined workflow would
#     have to either (a) build a release image on every PR (slow,
#     wastes GHCR quota) or (b) gate on `startsWith(github.ref, 'refs/tags/')`
#     which works but is harder to reason about than a separate file.
#   - Per the project convention (B100+), one workflow = one job family.
#   - Easier to test in isolation: tag a fake release branch, watch
#     only this workflow fire.
#
# Why ghcr.io (not Docker Hub):
#   - Free for public repos, no rate limit on pulls
#   - Same org as the code (BarsSky)
#   - Built-in to GitHub Actions (GITHUB_TOKEN has push permission)
#   - Operator already uses similar pattern (ghcr.io/BarsSky/skygate
#     would be the registry path)
#
# Why a MULTI-STAGE Dockerfile.prebuilt (not the existing single-stage
# in-container-build Dockerfile):
#   - The existing Dockerfile has the operator's local dev flow baked
#     in: it does `go mod download && go build` inside the entrypoint
#     so a bind-mounted source tree becomes a working binary. That's
#     the right thing for `./:/app` development, but it means:
#       (a) Image is ~600 MB (full Go toolchain + alpine)
#       (b) First start takes 60-120s (go mod + go build)
#       (c) Image always reflects "dev" unless the bind-mount's git
#           tree has a tag
#   - Dockerfile.prebuilt bakes the Go binary at CI build time:
#       (a) Image is ~30 MB (alpine + binary + runtime deps)
#       (b) First start is ~2s (just tailscale up + exec)
#       (c) Image always reflects the tag it was built from
#   - Both images share the same entrypoint.sh + the same
#     runtime config (env vars, ports, volumes). The only
#     difference is `SKYGATE_PREBUILT=1` which the entrypoint
#     checks to skip the build step.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v1.5.0, v1.5.0-rc.1, v1.5.0-alpha1, v1.5.2.1

# Cancel in-progress run when a new tag is pushed
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # for gh release create
  packages: write   # for ghcr.io push

jobs:
  # ============================================================
  # Job 1: Docker image → ghcr.io/barssky/skygate
  # ============================================================
  # 2026-09-11 (Issue #4 closure): single-arch x86_64 only.
  #
  # The pre-v1.5.4 release built linux/amd64 + linux/arm64 in
  # parallel matrix jobs. Both jobs pushed the same tag (vX.Y.Z);
  # docker/build-push-action@v6 doesn't compose the two pushes into
  # a manifest list — the second push overwrites the first, leaving
  # `docker pull :v1.5.2` with "no matching manifest for linux/amd64
  # in the manifest list entries" on amd64 hosts (the arm64 job ran
  # second and won the tag).
  #
  # Operator decision 2026-09-11: drop arm64. Reasons:
  #   - Issue #4 manifests in production (13.66 amd64 host) and
  #     blocks the auto-deploy flow
  #   - The Go binary tarballs (Job 2) STILL ship linux-arm64 +
  #     darwin-arm64 + windows-amd64 — operators on ARM Macs/hosts
  #     can `docker buildx build --platform linux/arm64` themselves
  #     from the released source if needed
  #   - Adding multi-arch back is a future B-block (imagetools
  #     create or single build-push-action with platforms list) —
  #     not in scope for this fix
  docker:
    name: docker image (linux/amd64 only)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full history for `git describe`

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Strip leading 'v' for numeric operations, keep 'v' for tag refs
          REF="${GITHUB_REF_NAME}"   # e.g. v1.5.0 or v1.5.0-rc.1
          VERSION="${REF#v}"          # 1.5.0 or 1.5.0-rc.1
          MAJOR_MINOR=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')
          MAJOR=$(echo "$VERSION" | sed -E 's/^([0-9]+).*/\1/')
          # Pre-release detection: anything after the first '-' in
          # the version. "1.5.0" → no pre-release. "1.5.0-rc.1" → pre-release.
          if echo "$VERSION" | grep -q '-'; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          # Short commit for the image label
          SHORT_SHA=$(git rev-parse --short HEAD)
          # B237.24 (v1.5.2+): the ghcr.io repository path MUST be
          # lowercase. The pipe-lowercase filter (e.g.
          # `github.repository_owner | lower`) works in plain
          # GitHub Actions expressions but NOT inside
          # `format('...', arg)` arg lists — the `format` function
          # parses its args as literal values, not sub-expressions,
          # so a pipe in the arg list is a parse error.
          # We pre-compute the lowercase owner here and pass it as a
          # step output, so the tag lines can use the clean
          # `steps.meta.outputs.lower_owner` everywhere.
          LOWER_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR"  >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR"              >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA"      >> "$GITHUB_OUTPUT"
          echo "lower_owner=$LOWER_OWNER"  >> "$GITHUB_OUTPUT"
          echo "[meta] version=$VERSION  major_minor=$MAJOR_MINOR  major=$MAJOR  pre=$IS_PRERELEASE  owner=$LOWER_OWNER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          # 2026-09-11 (Issue #4 closure): single-arch linux/amd64.
          # Pre-v1.5.4 this was `linux/${{ matrix.platform.arch }}`
          # with amd64+arm64 in a matrix — both jobs pushed the same
          # tag, the second push overwrote the first, leaving amd64
          # hosts with "no matching manifest for linux/amd64" on
          # `:v1.5.2`. Single-arch build means the floating tags
          # (latest / vX.Y / vX) are emitted unconditionally (no
          # `matrix.platform.arch == 'amd64'` guard needed).
          platforms: linux/amd64
          push: true
          # Always tag the exact version. Add the floating tags
          # (latest / major.minor / major) only for stable releases.
          #
          # B237.24 (v1.5.2+, 2026-09-08): the ghcr.io tag path
          # MUST be lowercase. docker/build-push-action@v6 rejects
          # mixed-case repository names with
          #   "repository name must be lowercase"
          # The operator's account is "BarsSky" (mixed-case) — without
          # a lowercase filter, the docker image would be tagged
          # `ghcr.io/BarsSky/skygate:...` and the push would fail.
          # The pre-B237.24 release.yml used the raw
          # `github.repository_owner` directly; that bug silently
          # broke the v1.5.0 and v1.5.2 docker images (both release
          # workflow runs failed with the same error).
          # B237.24 fix: the meta step pre-computes
          # `lower_owner = $GITHUB_REPOSITORY_OWNER | tr ...` and
          # exposes it as `steps.meta.outputs.lower_owner`. We use
          # that pre-computed value in all 4 tag lines below
          # (version + latest + vX.Y + vX). The pipe-lowercase filter
          # (e.g. `x | lower`) does NOT work in `format('...', arg)`
          # arg lists — the `format` function parses its args as
          # literal values, not sub-expressions, so a pipe inside
          # the arg list is a syntax error. That's why we
          # pre-compute. See scripts/check_b237_24.sh which pins
          # this contract so a future change can't silently
          # regress it.
          tags: |
            ghcr.io/${{ steps.meta.outputs.lower_owner }}/skygate:v${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.is_prerelease != 'true' && format('ghcr.io/{0}/skygate:latest', steps.meta.outputs.lower_owner) || '' }}
            ${{ steps.meta.outputs.is_prerelease != 'true' && format('ghcr.io/{0}/skygate:v{1}', steps.meta.outputs.lower_owner, steps.meta.outputs.major_minor) || '' }}
            ${{ steps.meta.outputs.is_prerelease != 'true' && format('ghcr.io/{0}/skygate:v{1}', steps.meta.outputs.lower_owner, steps.meta.outputs.major) || '' }}
          labels: |
            org.opencontainers.image.title=skygate
            org.opencontainers.image.description=Self-service web portal for Tailscale and headscale
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ steps.meta.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 2026-09-15 (B253 fix): disable SLSA provenance attestation.
          # docker/build-push-action@v6 generates a separate OCI
          # attestation manifest tagged with `unknown/unknown`
          # platform (no architecture field) alongside the image.
          # The GitHub Actions "Installation" widget iterates over
          # ALL manifests attached to the tag and shows install
          # instructions for each — so the operator saw two
          # `docker pull` rows (one for amd64, one for the
          # unknown attestation) even though only one image is
          # actually built. Setting provenance=false suppresses
          # the attestation so the install widget shows one
          # image. Trade-off: lose the SLSA supply-chain
          # attestation. The GitHub-native "provenance" UI
          # (Actions run → Summary → "Provenance") still works
          # because that comes from the workflow run metadata,
          # not from this OCI attestation.
          provenance: false
          # Same rationale for SBOM (cyclonedx JSON attached as
          # another unattributed manifest). Suppress for parity.
          sbom: false

  # ============================================================
  # Job 2: Go binary tarballs → GitHub Release
  # ============================================================
  binaries:
    name: go binary tarballs (linux/darwin/windows × amd64/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: tar.gz, archive_dir: linux-amd64   }
          - { goos: linux,   goarch: arm64, ext: tar.gz, archive_dir: linux-arm64   }
          - { goos: darwin,  goarch: amd64, ext: tar.gz, archive_dir: darwin-amd64  }
          - { goos: darwin,  goarch: arm64, ext: tar.gz, archive_dir: darwin-arm64  }
          - { goos: windows, goarch: amd64, ext: zip,   archive_dir: windows-amd64  }
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve version + short sha
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          VERSION="${REF#v}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION"    >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          BINARY_NAME="skygate"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="skygate.exe"
          fi
          OUTPUT_DIR="dist/${{ matrix.archive_dir }}"
          mkdir -p "$OUTPUT_DIR"
          echo "[build] GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"
          # 2026-08-12 v1.3.1: CGO_ENABLED=0 (postgres-only, no SQLite)
          # produces a 24 MB static binary. The build tags are the
          # same as the existing Dockerfile's entrypoint does.
          go build -buildvcs=false -trimpath \
            -ldflags "-s -w -X main.version=v${{ steps.meta.outputs.version }} -X main.commit=${{ steps.meta.outputs.short_sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "$OUTPUT_DIR/$BINARY_NAME" \
            ./cmd/skygate
          # Show the size so the operator can sanity-check
          ls -lh "$OUTPUT_DIR/$BINARY_NAME"

      - name: Compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.archive_dir }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sha256sum skygate.exe > skygate.exe.sha256
          else
            sha256sum skygate > skygate.sha256
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/${{ matrix.archive_dir }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            # Windows: zip with the .exe + .sha256 at the archive root
            zip -j "../skygate-v${{ steps.meta.outputs.version }}-${{ matrix.archive_dir }}.zip" \
              skygate.exe skygate.exe.sha256
          else
            # POSIX: tar.gz with the binary + sha at the root (NOT
            # inside a subdir — the install scripts expect a flat layout
            # so they can `tar -xzf ... && ./skygate` directly).
            tar -czf "../skygate-v${{ steps.meta.outputs.version }}-${{ matrix.archive_dir }}.tar.gz" \
              skygate skygate.sha256
          fi
          ls -lh "../skygate-v${{ steps.meta.outputs.version }}-${{ matrix.archive_dir }}.${{ matrix.ext }}"

      - name: Upload to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skygate-${{ matrix.archive_dir }}
          path: dist/skygate-v${{ steps.meta.outputs.version }}-${{ matrix.archive_dir }}.${{ matrix.ext }}
          retention-days: 14

  # ============================================================
  # Job 3: Compute SHA256SUMS across all binaries
  # (depends on binaries job so the sums cover all platforms)
  # ============================================================
  sums:
    name: SHA256SUMS
    runs-on: ubuntu-24.04
    needs: binaries
    timeout-minutes: 5
    steps:
      - name: Download all tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # The .sha256 inside each archive is a 2-line file
          # ("<hash>  <filename>"). We want a SINGLE file that
          # lists every archive + its hash, in a format that
          # `sha256sum -c` can verify against.
          rm -f skygate.exe.sha256 skygate.sha256 2>/dev/null || true
          sha256sum skygate-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 14

  # ============================================================
  # Job 4: GitHub Release with all artifacts
  # (depends on docker + binaries + sums)
  # ============================================================
  release:
    name: github release
    runs-on: ubuntu-24.04
    needs: [docker, sums]
    timeout-minutes: 10
    steps:
      - name: Checkout (release notes + history for the fallback)
        # 2026-09-19 (B263): this job had NO checkout step at all, so
        # RELEASE-NOTES.md was never present in the workspace. The old
        # notes step then set body_path to the empty string and the tag
        # was published with an EMPTY release body (v1.5.8). A sparse
        # checkout keeps it cheap — the artifacts arrive as downloads,
        # the source tree is not needed here.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            RELEASE-NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download release artifacts
        # B237.24.4 (v1.5.2+, 2026-09-08): the pre-B237.24.4 release
        # job used `actions/download-artifact@v4` with
        # `merge-multiple: true` and downloaded ALL 8 artifacts.
        # The merge-multiple path tries to extract all 8 in parallel
        # and fails after 5 retries if any one of them is slow.
        # B237.24.4.1: switch to per-artifact download by NAME (no
        # pattern, no merge-multiple). Each artifact is downloaded
        # to its own subdirectory, then the Flatten step moves
        # everything up to dist/. This avoids the parallel
        # extraction race and is more reliable on large artifacts.
        uses: actions/download-artifact@v4
        with:
          name: skygate-linux-amd64
          path: dist/skygate-linux-amd64
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: skygate-linux-arm64
          path: dist/skygate-linux-arm64
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: skygate-darwin-amd64
          path: dist/skygate-darwin-amd64
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: skygate-darwin-arm64
          path: dist/skygate-darwin-arm64
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: skygate-windows-amd64
          path: dist/skygate-windows-amd64
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: SHA256SUMS
          # 2026-09-18 (B262): this MUST NOT be dist/SHA256SUMS. The
          # artifact's only file is also named SHA256SUMS, so downloading
          # into a directory of that name produced
          # dist/SHA256SUMS/SHA256SUMS; the Flatten step below then moved
          # the file *into* the existing directory of the same name
          # (mv file dir/ is a no-op) and the release attached a directory
          # — which is why v1.5.6, v1.5.7 and v1.5.8 shipped NO SHA256SUMS
          # asset at all, and why the native self-updater had to fall back
          # to the GitHub per-asset digest. With a differently-named
          # directory the flatten step leaves a real dist/SHA256SUMS file.
          path: dist/checksums

      - name: Flatten artifact subdirectories
        # Each download step above put files in its own subdir
        # (dist/skygate-linux-amd64/, dist/SHA256SUMS/, etc.).
        # The Create release step below expects everything flat
        # in dist/ so the `files: |` glob matches. Move files
        # up one level and clean up.
        run: |
          set -euo pipefail
          cd dist
          find . -mindepth 2 -type f -exec mv -v '{}' . \;
          find . -mindepth 1 -type d -empty -delete
          ls -lh

      - name: List artifacts
        run: ls -lh dist/

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          VERSION="${REF#v}"
          # "Is this a pre-release?" matches the docker job's logic.
          # softprops/action-gh-release expects `prerelease: true|false`
          # as a string.
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release notes
        # 2026-09-19: release notes live in ONE canonical file,
        # RELEASE-NOTES.md (newest section first). Extract this tag's
        # "## vX.Y.Z" section into a temp file for the release body.
        #
        # The old per-version RELEASE-NOTES-vX.Y.Z.md convention is
        # retired. The v1.5.8 body was empty because this job had no
        # checkout at all (so no notes file could be found), the old
        # code then set body_path to the empty string, and
        # generate_release_notes was never set. Hence the checked-out
        # file above plus the git-log fallback below: never empty.
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES_FILE="RELEASE-NOTES.md"
          OUT="${RUNNER_TEMP}/release-notes.md"
          : > "$OUT"
          if [ -f "$NOTES_FILE" ]; then
            # From "## vX.Y.Z" up to (but not including) the next "## "
            # heading. The ([^0-9.]|$) guard keeps v1.5.9 from also
            # matching a v1.5.90 heading.
            awk -v ver="v${VERSION}" '
              !inside && $0 ~ ("^## " ver "([^0-9.]|$)") { inside = 1 }
              inside && $0 ~ "^## " && $0 !~ ("^## " ver "([^0-9.]|$)") { exit }
              inside { print }
            ' "$NOTES_FILE" > "$OUT"
            echo "[notes] extracted $(wc -l < "$OUT") lines from $NOTES_FILE"
          else
            echo "::warning::$NOTES_FILE is missing from the tagged commit"
          fi
          if ! grep -q '[^[:space:]]' "$OUT"; then
            echo "[notes] no '## v${VERSION}' section — falling back to the commit list"
            PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            {
              echo "## ${GITHUB_REF_NAME}"
              echo
              echo "_No hand-written section for this tag in \`RELEASE-NOTES.md\`; generated from the commit list._"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty='- %s (`%h`)' "${PREV_TAG}..${GITHUB_REF_NAME}" 2>/dev/null || true
              else
                git log --no-merges -30 --pretty='- %s (`%h`)' 2>/dev/null || true
              fi
            } > "$OUT"
            echo "[notes] generated $(wc -l < "$OUT") lines (previous tag: ${PREV_TAG:-none})"
          fi
          echo "notes_path=$OUT" >> "$GITHUB_OUTPUT"
          head -5 "$OUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          # Always a real file: the extracted RELEASE-NOTES.md section
          # or, if that section is missing, a generated commit list.
          body_path: ${{ steps.notes.outputs.notes_path }}
          fail_on_unmatched_files: false
          files: |
            dist/skygate-*.tar.gz
            dist/skygate-*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
