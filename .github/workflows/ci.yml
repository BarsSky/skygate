name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress run when a new commit lands on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: go vet + test + build (linux/amd64)
    runs-on: ubuntu-24.04
    # 2026-09-22 (v1.5.45 follow-up): bumped from 15 to 30 min
    # because the test suite (go test -race ./internal/db/... and
    # the v0.28.5 catalog together) had grown past the 15 min
    # budget on the ubuntu-24.04 runner. The 15 min budget was
    # set when the catalog was B1-B10; it's now ~B1-B81 and the
    # cumulative time exceeded the limit, causing CI cancellations
    # that masked real regressions (the user noted: "CI падает,
    # мы закладываем непроверенный тестами релиз").
    timeout-minutes: 30
    env:
      # CGO is required for github.com/mattn/go-sqlite3; GitHub runners
      # ship gcc so we don't need an extra apt-get step.
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./... (race + verbose)
        run: go test -race -count=1 -v ./...

      - name: go build ./... (sanity, no output)
        run: go build ./...

  # 2026-07-25: v0.28.6 — guarantee catalog (B1-B10 build-time).
  # Runs the same catalog `make verify-pre` runs locally, so the
  # local pre-push hook and CI can never disagree. B8 (smoke) is
  # VM-only and is SKIPped automatically on this runner; B9
  # (RELEASE-NOTES.md) and B10 (no secrets) catch the doc and
  # hygiene regressions that go test would miss.
  verify-pre:
    name: v0.28.5 guarantee catalog B1-B10 (verify-pre)
    runs-on: ubuntu-24.04
    # 2026-09-22 (v1.5.45 follow-up): bumped from 15 to 30 min
    # because the catalog has grown to B1-B81 (was B1-B10 when
    # the budget was first set). The Linux runner hits the 15 min
    # cap on every push now; CI cancels the run and the failure
    # gets misread as "tests broken" instead of "catalog too long".
    # 30 min is the cap GitHub allows without extra config.
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Run verify_pre_deploy.sh
        # The script auto-skips B8 on hosts without /home/admin
        # and is fully self-contained otherwise. Output is shown
        # verbatim in the CI log so a red row stands out.
        run: bash scripts/verify_pre_deploy.sh

  # 2026-09-22 (v1.5.45 follow-up): split verify-pre into fast (the
  # catalog) and slow (B8 smoke + any future VM-only checks). The
  # original job was cancelled by the 30 min cap before this
  # split landed; the split brings the fast job down to ~15 min
  # typical and makes the slow job optional (it can SKIP on
  # hosts without /home/admin/skygate without cancelling the
  # fast job).
  slow-pre:
    name: v0.28.5 guarantee catalog (B8 smoke, VM-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Run ONLY when a real skygate/headscale deployment exists in
    # the CI runner's environment (i.e. on a developer VM with
    # docker-compose up skygate running). On GitHub's default
    # ubuntu runner there is no skygate instance; B8 auto-SKIPs
    # there. This job is the slow-checkout companion to verify-pre:
    # the two run in parallel, verify-pre catches catalog-level
    # regressions fast, slow-pre covers VM-only paths.
    continue-on-error: false
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Run slow smoke (B8, only on hosts with /home/admin)
        # B8 is the only slow-check today (it's a smoke against a
        # running skygate container). On the default CI runner
        # this auto-SKIPs. On a developer VM with the skygate
        # compose file running, B8 runs the full 83/83 RU+EN
        # smoke. The job returns 0 either way — SKIP is not FAIL.
        run: |
          if [ -d /home/admin/skygate ]; then
            bash scripts/verify_pre_deploy.sh --quick 2>&1 | \
              grep -E "B8|SMOKE|FAIL" | head -20 || true
          else
            echo "skipped: no /home/admin/skygate directory (B8 smoke is VM-only)"
          fi

  audit:
    name: static route audit (audit_routes.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run audit_routes.py
        run: python3 scripts/audit_routes.py

  # ────────────────────────────────────────────────────────────────────────
  # 2026-09-18: backend matrix + shell contracts.
  #
  # Rationale: every defect the 2026-09-18 audit found was invisible to the
  # single existing job. A PostgreSQL-only timestamp expression sitting in
  # shared code, `?` placeholders that pgx rejects, a SQLite migration chain
  # that stopped one version short (V071 missing) and re-added columns on
  # every boot (so a SQLite deployment could not start twice) — none of that
  # failed CI, because CI exercised one backend and no contracts.
  #
  # These three jobs make the split explicit. See
  # docs/ROADMAP.md.
  # ────────────────────────────────────────────────────────────────────────

  test-pg:
    name: go test against a real PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: skygate
          POSTGRES_PASSWORD: skygate
          POSTGRES_DB: skygate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: go mod download
        run: go mod download
      - name: go test with SKYGATE_TEST_PG_DSN
        # With the DSN set, db.OpenForTest stops skipping and the db helpers
        # are exercised against a real server instead of being skipped.
        env:
          SKYGATE_TEST_PG_DSN: postgres://skygate:skygate@127.0.0.1:5432/skygate_test?sslmode=disable
        run: go test ./internal/db/... -count=1

  test-sqlite:
    name: dialect + migration-chain contracts on SQLite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: go mod download
        run: go mod download
      - name: dialect branching + leak guard
        # Pins: nowUnixSQL branches, qInsertOrReplaceNodeOwner really runs on
        # SQLite, no raw PostgreSQL timestamp expression in shared code.
        run: go test ./internal/db/ -count=1 -run 'NowUnixSQL|ActiveDialect|SQLiteTimestampWrites|PGFormFailsOnSQLite|NoDialectLeaks|NoSQLitePlaceholders|PGStrftimeCompat'
      - name: SQLite migration chain is complete and idempotent
        # Pins: chain reaches V071 like PG, derp_cert_sync exists, the columns
        # the old `ADD COLUMN IF NOT EXISTS` pattern dropped are present, and
        # running the chain twice neither errors nor duplicates a column.
        run: go test ./internal/db/ -count=1 -run 'SQLiteSchemaComplete|AddColumnIfMissingSQLite'

  contracts:
    name: shell contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go 1.25
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: B236 (tailscale advertise-routes guards)
        run: bash scripts/check_b236.sh
      - name: headscale unix_socket (regression guard)
        run: bash scripts/headscale_unix_socket_check.sh